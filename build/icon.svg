<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="tech_blue" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
        <filter id="shadow_blue" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.4"/>
        </filter>
    </defs>
    <rect width="512" height="512" rx="112" fill="url(#tech_blue)"/>
    
    <!-- Ring -->
    <circle cx="256" cy="256" r="140" stroke="white" stroke-width="48" stroke-opacity="0.25"/>
    <circle cx="256" cy="256" r="90" fill="white" fill-opacity="1"/>
    
    <!-- Arrow Breaking Out -->
    <g filter="url(#shadow_blue)">
        <path d="M256 256 L350 150" stroke="#1D4ED8" stroke-width="40" stroke-linecap="round"/>
        <path d="M350 150 L310 150 L350 150 L350 190" stroke="#1D4ED8" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="256" cy="256" r="24" fill="#1D4ED8"/>
    </g>
</svg>